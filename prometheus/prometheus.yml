# Prometheus configuration - Phase 1
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitor: application-monitoring
    environment: development

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus self-monitoring (scrape availability of the monitoring platform itself).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          application: monitoring-platform
          environment: development

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          application: monitoring-platform
          environment: development

  # Funeral Back Office System (Django running directly on the Windows host).
  # Inside a container, "localhost" is the container itself, NOT Windows;
  # host.docker.internal resolves to the Windows host (Docker Desktop).
  - job_name: funeral-back-office
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/funeral-back-office-metrics.token
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          application: funeral-back-office
          environment: development
