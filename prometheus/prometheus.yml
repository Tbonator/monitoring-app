# Prometheus configuration.
#
# Job definitions live here; TARGETS and their labels (application,
# environment, host, ...) live in environment-specific files:
#   prometheus/targets/development/<job>.yml   (local laptop)
#   prometheus/targets/production/<job>.yml    (production servers)
# docker-compose mounts the right directory at /etc/prometheus/targets via
# PROMETHEUS_TARGETS_DIR. File changes are picked up without a restart.
#
# Conventions (see docs/application-integration.md):
#   * every target carries application + environment labels
#   * an application's own /metrics target carries kind: application

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitor: application-monitoring

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ---- Monitoring platform ----------------------------------------------------
  - job_name: prometheus
    file_sd_configs: [{files: ["/etc/prometheus/targets/prometheus.yml"]}]

  - job_name: alertmanager
    file_sd_configs: [{files: ["/etc/prometheus/targets/alertmanager.yml"]}]

  - job_name: loki
    file_sd_configs: [{files: ["/etc/prometheus/targets/loki.yml"]}]

  # Dev: alloy container next to Loki. Prod: Alloy runs on the app server.
  - job_name: alloy
    file_sd_configs: [{files: ["/etc/prometheus/targets/alloy.yml"]}]

  # ---- Infrastructure -----------------------------------------------------------
  # Linux hosts (node_exporter): the monitoring host and, in production, the app host.
  - job_name: node
    file_sd_configs: [{files: ["/etc/prometheus/targets/node.yml"]}]

  # Windows hosts (windows_exporter). Dev: the laptop running Django.
  - job_name: windows
    file_sd_configs: [{files: ["/etc/prometheus/targets/windows.yml"]}]

  # PostgreSQL servers (postgres_exporter, read-only pg_monitor user).
  - job_name: postgres
    file_sd_configs: [{files: ["/etc/prometheus/targets/postgres.yml"]}]

  - job_name: blackbox-exporter
    file_sd_configs: [{files: ["/etc/prometheus/targets/blackbox-exporter.yml"]}]

  # Prometheus-side HTTP probes. Each target sets a "module" label
  # (http_2xx | http_ready | http_2xx_follow); the URL becomes "instance".
  - job_name: blackbox-http
    metrics_path: /probe
    scrape_interval: 30s
    file_sd_configs: [{files: ["/etc/prometheus/targets/blackbox-http.yml"]}]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # TLS certificate expiry of HTTPS endpoints.
  - job_name: blackbox-tls
    metrics_path: /probe
    scrape_interval: 1h
    params:
      module: [https_tls]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/blackbox-tls.yml"]
        refresh_interval: 5m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ---- Applications ---------------------------------------------------------------
  # Funeral Back Office /metrics (bearer token from secrets/, never in Git).
  - job_name: funeral-back-office
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/funeral-back-office-metrics.token
    file_sd_configs: [{files: ["/etc/prometheus/targets/funeral-back-office.yml"]}]
