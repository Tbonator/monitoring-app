# PRODUCTION targets. Replace the placeholders:
#   APP_SERVER_PRIVATE_IP   private/VPN address of the Funeral Back Office server
#   *.example.co.za         public hostnames
- targets: ["http://APP_SERVER_PRIVATE_IP:8000/health/live/"]
  labels: {application: funeral-back-office, environment: production, module: http_2xx, endpoint: live}
- targets: ["http://APP_SERVER_PRIVATE_IP:8000/health/ready/"]
  labels: {application: funeral-back-office, environment: production, module: http_ready, endpoint: ready}
- targets: ["http://uptime-kuma:3001/"]
  labels: {application: monitoring-platform, environment: production, module: http_2xx_follow, endpoint: health}
- targets:
    - http://grafana:3000/api/health
    - http://alertmanager:9093/-/healthy
    - http://loki:3100/ready
    - http://glitchtip:8000/_health/
  labels: {application: monitoring-platform, environment: production, module: http_2xx, endpoint: health}